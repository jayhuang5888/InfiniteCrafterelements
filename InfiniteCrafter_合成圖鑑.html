<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infinite Crafter 合成圖鑑</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 左側依「階」排列的進化線瀏覽器，右側固定的元素詳情與遞迴合成樹 */
:root{
  --bg:#e9edf2; --panel:#f8fafc; --ink:#1b2230; --muted:#5d6779; --line:#c9d1dc; --chip:#ffffff; --hl:#ffe9a8;
  --accent:#e2602a; --up:#1f6feb; --earth:#9a6436; --fire:#e2602a; --water:#1f86d1; --wind:#2a9e86;
  --display:"Lilita One","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
  --shadow:0 1px 0 rgba(20,30,50,.08);
  /* 品階顏色取自遊戲卡片底圖 Card_1～Card_5（I～V）：底色 / 底條 / 主色 */
  --t1-bg:#ededed; --t1-band:#d9d9d9; --t1-hi:#a3a3a3;
  --t2-bg:#d1f6dc; --t2-band:#a4edba; --t2-hi:#3fc969;
  --t3-bg:#c2f0ff; --t3-band:#86e2ff; --t3-hi:#14b4ea;
  --t4-bg:#e5ddfb; --t4-band:#ccbbf8; --t4-hi:#8f6ee8;
  --t5-bg:#ffcece; --t5-band:#ff9c9c; --t5-hi:#f04040;
  --card-ink:#1d1d1f; --card-muted:#4a4a52; --card-line:#202024;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161e; --panel:#1a202b; --ink:#e9edf3; --muted:#9aa5b8; --line:#2c3443; --chip:#212836; --hl:#4a3d14;
  --accent:#ff8a4c; --up:#5aa2ff; --earth:#c98b55; --fire:#ff8a4c; --water:#4fb0f0; --wind:#4cc9ab; --shadow:0 1px 0 rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161e; --panel:#1a202b; --ink:#e9edf3; --muted:#9aa5b8; --line:#2c3443; --chip:#212836; --hl:#4a3d14;
  --accent:#ff8a4c; --up:#5aa2ff; --earth:#c98b55; --fire:#ff8a4c; --water:#4fb0f0; --wind:#4cc9ab; --shadow:0 1px 0 rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-bottom:20px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,4vw,40px);line-height:1.05;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--muted);margin-bottom:6px}
.bases{display:flex;gap:6px}
.bases img{width:30px;height:30px}
.stats{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.search{margin-left:auto;flex:1 1 220px;max-width:320px}
.search input{width:100%;font:inherit;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:24px;align-items:start}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr)} #detail{order:-1} .search{margin-left:0;max-width:none}}
.tier{margin-bottom:22px}
.tier h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
.rom{display:inline-grid;place-items:center;min-width:34px;height:28px;padding:0 6px;border-radius:8px;border:2px solid var(--card-line);background:var(--tb);color:var(--thi);font-family:var(--display);font-size:18px;-webkit-text-stroke:.6px var(--card-line)}
.tier h2 span{font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.06em}
.lines{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.line{display:flex;align-items:stretch;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--shadow)}
.line .tag{writing-mode:vertical-rl;font-size:10px;letter-spacing:.08em;color:var(--muted);font-variant-numeric:tabular-nums;padding:2px 0;align-self:center}
.t1{--tb:var(--t1-bg);--tband:var(--t1-band);--thi:var(--t1-hi)}
.t2{--tb:var(--t2-bg);--tband:var(--t2-band);--thi:var(--t2-hi)}
.t3{--tb:var(--t3-bg);--tband:var(--t3-band);--thi:var(--t3-hi)}
.t4{--tb:var(--t4-bg);--tband:var(--t4-band);--thi:var(--t4-hi)}
.t5{--tb:var(--t5-bg);--tband:var(--t5-band);--thi:var(--t5-hi)}
.chip{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 0;border:2px solid var(--card-line);border-radius:10px;background:var(--tb);color:var(--card-ink);font:inherit;cursor:pointer;position:relative;overflow:hidden}
.chip .band{align-self:stretch;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--tband);padding:3px 3px 4px;margin-top:4px;min-width:0}
.chip:hover{filter:brightness(1.04);transform:translateY(-1px)}
.chip:focus-visible{outline:2px solid var(--accent)}
.chip.on{outline:3px solid var(--ink);outline-offset:2px}
.chip.dim{opacity:.22}
.chip.anc{box-shadow:0 0 0 3px var(--accent)}
.chip.desc{outline:3px dashed var(--up);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin:-6px 0 16px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:12px;border-radius:3px}
.legend .k-on{outline:2.5px solid var(--ink)}
.legend .k-anc{box-shadow:0 0 0 2.5px var(--accent)}
.legend .k-desc{outline:2.5px dashed var(--up)}
.chip img{width:44px;height:44px}
.chip b{font-size:13px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip u{text-decoration:none;font-size:11.5px;font-weight:500;color:var(--card-ink);opacity:.8;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip i.ien{font-size:10px;opacity:.85}
.chip i{font-style:normal;font-size:10.5px;color:var(--card-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.line .arrow{align-self:center;color:var(--muted);font-size:12px}
.single .lines{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
#detail{position:sticky;top:max(12px,env(safe-area-inset-top,0px));background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:900px){#detail{position:static;max-height:none}}
.hero{display:flex;gap:16px;align-items:center}
.hero>img{width:96px;height:96px;flex:none;padding:8px;border-radius:16px;border:2.5px solid var(--card-line);background:var(--tb);box-shadow:inset 0 -14px 0 var(--tband)}
.hero h3{font-family:var(--display);font-weight:400;font-size:30px;margin:0;line-height:1.1}
.hero .en{font-family:var(--display);font-size:20px;color:var(--muted);letter-spacing:.02em;line-height:1.1}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:99px;background:var(--chip);border:1px solid var(--line);margin-top:6px;font-variant-numeric:tabular-nums}
.desc{margin:14px 0 4px}
.desc-en{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.sec{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted);margin:18px 0 8px;display:flex;justify-content:space-between;gap:8px}
.cost{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}
.cost span{display:block;height:100%}
.costkey{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:13px;font-variant-numeric:tabular-nums}
.costkey em{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.costkey img{width:20px;height:20px}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:15px;padding-left:14px;border-left:2px solid var(--line)}
.tree li{position:relative}
.tree ul>li::before{content:"";position:absolute;left:-14px;top:19px;width:12px;border-top:2px solid var(--line)}
.tree ul>li:last-child::after{content:"";position:absolute;left:-16px;top:21px;bottom:0;width:4px;background:var(--panel)}
.node{display:flex;align-items:center;gap:7px;padding:3px 6px 3px 2px;border-radius:9px;cursor:pointer;border:0;background:none;color:inherit;font:inherit;text-align:left}
.node:hover{background:var(--chip)}
.node:focus-visible{outline:2px solid var(--accent)}
.node img{width:36px;height:36px;padding:3px;border-radius:8px;border:1.5px solid var(--card-line);background:var(--tb)}
.node b{font-weight:700;font-size:14px}
.node .nen{font-size:12.5px;color:var(--ink);opacity:.75;margin-right:2px}
.node small{color:var(--muted);font-size:11px}
.tog{width:18px;height:18px;flex:none;border-radius:5px;border:1px solid var(--line);background:var(--chip);color:var(--muted);font-size:12px;line-height:15px;text-align:center;cursor:pointer;padding:0}
.tog.leaf{visibility:hidden}
li.closed>ul{display:none}
.uses{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.use{display:flex;align-items:center;gap:6px;padding:6px;border-radius:10px;background:var(--chip);border:1px solid var(--line);cursor:pointer;color:inherit;font:inherit;font-size:13px;text-align:left}
.use:hover{border-color:var(--accent)}
.use img{width:30px;height:30px;padding:2px;border-radius:7px;border:1.5px solid var(--card-line);background:var(--tb);flex:none}
.use>span{min-width:0;line-height:1.3;overflow-wrap:anywhere}
.use .plus{color:var(--muted)}
.ups{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.up{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;border:0;background:none;color:inherit;font:inherit;font-size:12px;cursor:pointer;border-radius:8px;text-align:center}
.up:hover{background:var(--chip)}
.up img{width:40px;height:40px;padding:3px;border-radius:8px;border:1.5px solid var(--card-line);background:var(--tb)}
.up small{display:block;font-size:10px;color:var(--muted)}
.up span{min-width:0;max-width:100%;overflow-wrap:anywhere;line-height:1.2}
.none{color:var(--muted);font-size:13px}
footer{margin-top:28px;color:var(--muted);font-size:12px;max-width:70ch}
@media (prefers-reduced-motion:no-preference){.chip,.use{transition:background .12s,opacity .15s,border-color .12s}}
</style>

</head>
<body>
<div class="wrap">
<header>
  <h1><small>INFINITE CRAFTER · TD</small>合成圖鑑</h1>
  <div>
    <div class="bases" id="bases"></div>
    <div class="stats" id="stats"></div>
  </div>
  <label class="search"><input id="q" type="search" placeholder="搜尋元素（中文或英文）" autocomplete="off" aria-label="搜尋元素"></label>
</header>
<div class="legend" aria-label="圖例"><span><i class="k-on"></i>目前選取</span><span><i class="k-anc"></i>下位物品（合成它需要的材料，<b id="lgA">0</b> 種）</span><span><i class="k-desc"></i>上位物品（它能往上合成出的元素，<b id="lgD">0</b> 種）</span></div>
<main>
  <section id="browser" aria-label="依階層瀏覽元素"></section>
  <aside id="detail" aria-live="polite"></aside>
</main>
<footer>資料取自遊戲安裝檔內的合成登錄表（RecipeRegistry），共 86 條配方。每張卡片下方的小字是該元素的配方；點選任一元素可查看完整合成樹（左側會以橘紅色框標出下位物品、藍色虛線框標出上位物品）、所需基本元素數量，以及它還能合成什麼。同一條進化線（例如 烈焰 → 熔岩 → 黑曜石）在遊戲內共用一個編號。卡片底色沿用遊戲內 I～V 品階卡的配色（灰、綠、藍、紫、紅），基本元素對應 I。圖示版權屬於 Rollic Games，僅供個人參考。</footer>
</div>

const E = DATA.els, R = DATA.rec;
const BASE = ["Earth","Fire","Water","Wind"];
const BASECOL = {Earth:"var(--earth)",Fire:"var(--fire)",Water:"var(--water)",Wind:"var(--wind)"};
const ROMAN = ["I","II","III","IV","V"];
const TIER = ["基本元素","第一階","第二階","第三階","第四階"];
const recipeOf = {}, usedIn = {};
for (const [a,b,o] of R){ recipeOf[o]=[a,b]; (usedIn[a]=usedIn[a]||[]).push([b,o]); if(a!==b)(usedIn[b]=usedIn[b]||[]).push([a,o]); }
const slug = id => id.replace(/[^A-Za-z0-9-]/g,"");

const memo = {};
function cost(id){
  if (memo[id]) return memo[id];
  const c = {Earth:0,Fire:0,Water:0,Wind:0};
  if (!recipeOf[id]) c[id]=1; else for (const p of recipeOf[id]){ const s=cost(p); for(const k in s) c[k]+=s[k]; }
  return memo[id]=c;
}
function descendants(id, set=new Set()){ for(const [,o] of (usedIn[id]||[])){ if(!set.has(o)){ set.add(o); descendants(o,set);} } return set; }
function ancestors(id, set=new Set()){ const r=recipeOf[id]; if(r) for(const p of r){ set.add(p); ancestors(p,set);} return set; }
const img = (id,cls="") => `<img src="${E[id].img}" alt="" ${cls}>`;
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

document.getElementById("bases").innerHTML = BASE.map(b=>img(b,`title="${E[b].zh} ${b}"`)).join("");
document.getElementById("stats").textContent = `${Object.keys(E).length} 個元素 · ${R.length} 條配方`;

// 瀏覽器：依階 → 進化線
const lines = {};
for (const id in E){ const e=E[id]; (lines[e.line]=lines[e.line]||[]).push(id); }
const lineKeys = Object.keys(lines).sort((a,b)=>{const [a1,a2]=a.split(".").map(Number),[b1,b2]=b.split(".").map(Number);return a1-b1||a2-b2;});
let html="";
for (let g=0; g<=4; g++){
  const ks = lineKeys.filter(k=>+k.split(".")[0]===g);
  if (!ks.length) continue;
  const n = ks.reduce((s,k)=>s+lines[k].length,0);
  if (g===0){
    html += `<div class="tier single"><h2><b class="rom t${g+1}">${ROMAN[g]}</b>${TIER[g]}<span>${n} 個 · 一切的起點</span></h2><div class="lines">`;
    for (const id of BASE) html += `<div class="line">${chip(id)}</div>`;
  } else {
    html += `<div class="tier"><h2><b class="rom t${g+1}">${ROMAN[g]}</b>${TIER[g]}<span>${ks.length} 條進化線 · ${n} 個元素</span></h2><div class="lines">`;
    for (const k of ks){
      const ids = lines[k].sort((a,b)=>E[a].s-E[b].s);
      html += `<div class="line"><span class="tag">${k}</span>` + ids.map(chip).join(`<span class="arrow" aria-hidden="true">›</span>`) + `</div>`;
    }
  }
  html += `</div></div>`;
}
function chip(id){
  const e=E[id], r=recipeOf[id];
  const sub = r ? `${E[r[0]].zh}＋${E[r[1]].zh}` : "基本";
  const subEn = r ? `${r[0]} + ${r[1]}` : "Base";
  return `<button class="chip t${e.g+1}" data-id="${id}" title="${esc(e.zh)} ${esc(id)} · 品階 ${ROMAN[e.g]}">${img(id)}<span class="band"><b>${e.zh}</b><u>${esc(id)}</u><i>${sub}</i><i class="ien">${esc(subEn)}</i></span></button>`;
}
const browser = document.getElementById("browser");
browser.innerHTML = html;
browser.addEventListener("click", ev=>{ const b=ev.target.closest(".chip"); if(b) select(b.dataset.id,true); });

// 搜尋
const q = document.getElementById("q");
q.addEventListener("input", ()=>{
  const t = q.value.trim().toLowerCase();
  for (const c of browser.querySelectorAll(".chip")){
    const e=E[c.dataset.id];
    c.classList.toggle("dim", !!t && !(e.zh.includes(t) || e.id.toLowerCase().includes(t)));
  }
});

// 詳情
const detail = document.getElementById("detail");
function treeHTML(id, depth=0){

  detail.innerHTML = `
    <div class="hero t${e.g+1}">${img(id)}<div><h3>${e.zh}</h3><div class="en">${esc(e.id)}</div>
      <span class="badge" style="background:var(--tb);color:var(--card-ink);border-color:var(--card-line)">品階 ${ROMAN[e.g]} · ${TIER[e.g]}${e.g?` · 線 ${e.line}`:""}</span></div></div>
    <p class="desc">${esc(e.desc)}</p><p class="desc-en">${esc(e.en)}</p>
    ${r?`<div class="sec"><span>所需基本元素</span><span>${total} 個 · 合成 ${steps} 次</span></div><div class="cost">${bar}</div><div class="costkey">${key}</div>
    <div class="sec"><span>合成樹</span><span><button class="tog" id="collapseAll" style="width:auto;padding:0 8px" aria-label="全部收合或展開">全部收合</button></span></div><ul class="tree">${treeHTML(id)}</ul>`:`<div class="sec"><span>基本元素</span></div><p class="none">開局就有，不需要合成。</p>`}
    <div class="sec"><span>可用於合成（直接上位）</span><span>${(usedIn[id]||[]).length} 種</span></div>
    ${uses?`<div class="uses">${uses}</div>`:`<p class="none">目前沒有以它為材料的配方，是這條路線的終點。</p>`}
    ${des.size>(usedIn[id]||[]).length?`<div class="sec"><span>所有上位物品</span><span>${des.size} 種</span></div><div class="ups">${[...des].sort((a,b)=>E[a].g-E[b].g||E[a].line.localeCompare(E[b].line,undefined,{numeric:true})).map(o=>`<button class="up t${E[o].g+1}" data-id="${o}" title="${esc(E[o].zh)} ${esc(o)}">${img(o)}<span>${E[o].zh}<small>${esc(o)}</small></span></button>`).join("")}</div>`:""}`;
  if (push){ try{ history.replaceState(null,"","#"+slug(id)); }catch(_){ location.hash = slug(id); }
    if (matchMedia("(max-width:900px)").matches) detail.scrollIntoView({behavior:"smooth",block:"start"}); }
  detail.scrollTop = 0;
}
detail.addEventListener("click", ev=>{
  const t = ev.target;
  if (t.id==="collapseAll"){
    const tree=detail.querySelector(".tree"); const closing = t.textContent==="全部收合";
    tree.querySelectorAll("li").forEach((li,i)=>{ if(i===0) return; if(li.querySelector(":scope>ul")){ li.classList.toggle("closed",closing); const tg=li.querySelector(".tog"); if(tg) tg.textContent=closing?"+":"−"; }});
    t.textContent = closing ? "全部展開" : "全部收合"; return;
  }
  if (t.classList.contains("tog") && !t.classList.contains("leaf")){
    const li=t.closest("li"); li.classList.toggle("closed"); t.textContent=li.classList.contains("closed")?"+":"−"; return;
  }
  const n = t.closest(".node,.use,.up"); if (n) select(n.dataset.id,true);
});
function fromHash(){ const id=bySlug[location.hash.slice(1)]; select(id||"Laser",false); }
addEventListener("hashchange", fromHash);
fromHash();
</script>
